name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Mobile-friendly: if you uploaded yo-party.zip to the repo root, unpack it here.
      - name: Unpack yo-party.zip (if present)
        run: | if [ -f yo-party.zip ]; then unzip -o yo-party.zip -x ".github/*" fi 
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: | echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> gradle.properties chmod +x gradlew ./gradlew assembleRelease --no-daemon 
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yo-party-apk
          path: android/app/build/outputs/apk/release/*.apk
